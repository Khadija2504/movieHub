name: moviehub

services:
  db:
    image: postgres:16-alpine
    container_name: moviehub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-movie_hub}
      POSTGRES_USER: ${POSTGRES_USER:-moviehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moviehub}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: moviehub-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@moviehub.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
