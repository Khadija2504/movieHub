spring:
  application:
    name: moviehub

  # Load the root .env file (works whether the app is started from the repo root or from MOVIEHUB/).
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  # Values come from environment variables; the defaults match docker-compose.yml (db on host port 5433).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/movie_hub}
    username: ${DB_USERNAME:moviehub}
    password: ${DB_PASSWORD:moviehub}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway (src/main/resources/db/migration)
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  # TMDB responses are cached in memory (catalog data changes slowly).
  cache:
    cache-names: tmdb
    caffeine:
      spec: maximumSize=5000,expireAfterWrite=1h

server:
  port: ${SERVER_PORT:8088}
  error:
    include-stacktrace: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  tmdb:
    api-key: ${TMDB_API_KEY:}
    base-url: https://api.themoviedb.org/3
    image-base-url: https://image.tmdb.org/t/p
    language: ${TMDB_LANGUAGE:en-US}
    connect-timeout: 5s
    read-timeout: 10s
    # Optional HTTP proxy for TMDB calls (e.g. a local VPN proxy like http://127.0.0.1:12001). Empty = direct.
    proxy: ${TMDB_PROXY:}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  storage:
    # Uploaded files (avatars). Relative paths are resolved from the working directory.
    dir: ${STORAGE_DIR:./storage}
  # Development only: create demo cinemas and fill the next 7 days with screenings of movies in theatres.
  demo-data: ${DEMO_DATA:false}
  admin:
    email: ${ADMIN_EMAIL:admin@moviehub.dev}
    password: ${ADMIN_PASSWORD:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:info}
